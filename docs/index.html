<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>F5 Workforce AI Security - Writable Lab Guide</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0" />
  <meta name="description" content="Hands-on lab guide for F5 Workforce AI Security (WAIS) writable UDF tenant." />
  <!-- All assets are vendored locally under vendor/ so the site works without a CDN. -->
  <link rel="stylesheet" href="vendor/vue.css" />
  <style>
    /* Light F5-appropriate accent (red). Not an official F5 brand stylesheet. */
    :root {
      --theme-color: #c8102e; /* accent only; official F5 theme review pending */
      --theme-color-dark: #a30d26;
    }
    .app-name-link img { max-width: 100%; }
    .markdown-section { max-width: 48rem; }
    .markdown-section table { display: table; width: 100%; }
    /* Simple callout boxes rendered from blockquotes with leading markers. */
    .callout { border-left: 4px solid #ccc; padding: 0.6em 1em; margin: 1em 0; border-radius: 4px; }
    .callout-note { border-left-color: #2b6cb0; background: #ebf4ff; }
    .callout-tip { border-left-color: #2f855a; background: #e6fffa; }
    .callout-warning { border-left-color: #c05621; background: #fffaf0; }
    .callout-result { border-left-color: #6b46c1; background: #faf5ff; }
    .cover-main .start-btn a { background: var(--theme-color); color: #fff; border-color: var(--theme-color); }
  </style>
</head>
<body>
  <div id="app">Loading the WAIS Writable Lab Guide…</div>
  <script>
    window.$docsify = {
      name: 'WAIS Writable Lab',
      repo: '', // placeholder: set when the GitHub repo exists (see DEPLOYMENT.md)
      loadSidebar: true,
      loadNavbar: false,
      coverpage: true,
      onlyCover: false,
      homepage: 'README.md',
      maxLevel: 3,
      subMaxLevel: 2,
      auto2top: true,
      relativePath: false,
      search: {
        placeholder: 'Search the lab guide',
        noData: 'No results.',
        depth: 3
      },
      copyCode: {
        buttonText: 'Copy',
        successText: 'Copied'
      }
    };
  </script>
  <!-- Docsify core (pinned v4.13.1) and plugins, all local -->
  <script src="vendor/docsify.min.js"></script>
  <script src="vendor/search.min.js"></script>
  <script src="vendor/zoom-image.min.js"></script>
  <script src="vendor/docsify-copy-code.min.js"></script>
  <!-- Prism language components for copyable, highlighted code blocks -->
  <script src="vendor/prism-bash.min.js"></script>
  <script src="vendor/prism-powershell.min.js"></script>
  <script src="vendor/prism-json.min.js"></script>
</body>
</html>
